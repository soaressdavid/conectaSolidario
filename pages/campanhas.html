<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campanhas – Conecta Solidário</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/pages/campanhas.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="../index.html" class="navbar-brand">
      <span class="brand-icon">🤝</span> Conecta Solidário
    </a>
    <ul class="navbar-nav">
      <li><a href="../index.html">Início</a></li>
      <li><a href="../index.html#sobre">Sobre</a></li>
      <li><a href="campanhas.html" class="active">Campanhas</a></li>
      <li><a href="voluntario.html">Seja Voluntário</a></li>
      <li><a href="../index.html#contato">Contato</a></li>
    </ul>
    <div class="navbar-actions">
      <a href="voluntario.html" class="btn btn-primary btn-sm">Quero Ajudar</a>
    </div>
    <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="mobile-menu">
  <a href="../index.html">Início</a>
  <a href="campanhas.html">Campanhas</a>
  <a href="voluntario.html">Seja Voluntário</a>
  <a href="../index.html#contato">Contato</a>
</div>

<div class="page-hero">
  <div class="container">
    <div class="section-label" style="color:rgba(255,255,255,.6)">Ação social</div>
    <h1>Campanhas</h1>
    <p>Veja todas as campanhas e escolha como deseja contribuir.</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">Todas</button>
      <button class="filter-btn" data-filter="ativa">Ativas</button>
      <button class="filter-btn" data-filter="em breve">Em breve</button>
      <button class="filter-btn" data-filter="encerrada">Encerradas</button>
    </div>
    <div id="campaigns-grid" class="campaigns-grid">
      <div class="loader-wrap"><div class="spinner"></div><p>Carregando…</p></div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-bottom" style="border-top:1px solid rgba(255,255,255,.1);padding-top:24px">
      <span>© 2024 Conecta Solidário</span>
      <span>Feito com <i class="fas fa-heart"></i> para quem precisa</span>
    </div>
  </div>
</footer>

<div id="toast-container"></div>
<script src="../js/config.js"></script>
<script src="../js/api-unified.js"></script>
<script>
  const ICONS = ['<i class="fas fa-bread-slice"></i>','<i class="fas fa-tshirt"></i>','<i class="fas fa-pump-soap"></i>','<i class="fas fa-pills"></i>','<i class="fas fa-book"></i>','<i class="fas fa-home"></i>','<i class="fas fa-bath"></i>','<i class="fas fa-salad"></i>'];
  let allData = [];
  let currentFilter = 'all';

  function renderGrid(data) {
    const grid = document.getElementById('campaigns-grid');
    const filtered = currentFilter === 'all' ? data :
      data.filter(c => campaignStatus(c.data_inicio, c.data_fim).label.toLowerCase() === currentFilter);

    if (!filtered.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <div class="icon">🔍</div>
        <h3>Nenhuma campanha encontrada</h3>
        <p>Tente outro filtro.</p>
      </div>`; return;
    }

    grid.innerHTML = filtered.map((c, i) => {
      const st = campaignStatus(c.data_inicio, c.data_fim);
      return `
      <div class="card campaign-card" data-status="${st.label.toLowerCase()}">
        <div class="campaign-card-top">
          <div class="campaign-icon">${ICONS[i % ICONS.length]}</div>
          <span class="badge ${st.cls}">${st.label}</span>
        </div>
        <div class="campaign-card-body">
          <h3>${c.titulo}</h3>
          <p>${c.descricao}</p>
          <div class="campaign-dates">📅 <span>${formatDate(c.data_inicio)}</span> até <span>${formatDate(c.data_fim)}</span></div>
          ${st.label === 'Ativa' ? `<a href="voluntario.html" class="btn btn-forest btn-sm">Quero ajudar</a>` : `<span class="btn btn-ghost btn-sm" style="cursor:default">${st.label}</span>`}
        </div>
      </div>`;
    }).join('');
  }

  async function loadCampanhas() {
    const grid = document.getElementById('campaigns-grid');
    try {
      const data = await API.getCampanhas();
      allData = data || [];
    } catch {
      allData = [];
    }
    renderGrid(allData);
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderGrid(allData);
    });
  });

  loadCampanhas();
</script>
</body>
</html>
